[project]
name = "sandbox-cli"
version = "0.3.0"
description = "Command line tool for interaction with sandboxes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alexey Kolesnikov", email = "delvinru@gmail.com" }]
dependencies = [
  "aiofiles>=25.1.0",
  "asyncssh>=2.24.0",
  "colorama>=0.4.6",
  "cryptography>=49.0.0",
  "cyclopts>=4.20.0",
  "docker>=7.2.0",
  "ptsandbox>=5.1.0",
  "rich>=15.0.0",
  "zstandard>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/Security-Experts-Community/sandbox-cli"
Documentation = "https://security-experts-community.github.io/sandbox-cli"
Repository = "https://github.com/Security-Experts-Community/sandbox-cli"
Issues = "https://github.com/Security-Experts-Community/sandbox-cli/issues"

[dependency-groups]
dev = [
  "black==26.5.1",
  "isort==8.0.1",
  "mypy==2.3.0",
  "ruff==0.14.0",
  "types-aiofiles==25.1.0.20260518",
  "types-docker==7.2.0.20260728",
  "types-colorama==0.4.15.20260508",
]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7", "termynal==0.14.0"]

[project.scripts]
sandbox-cli = "sandbox_cli.__main__:main"

# uv settings
[tool.uv]
package = true

# build system
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["sandbox_cli"]

# tools settings
[tool.pylint]
max-line-length = 120

[tool.pyright]
reportUnknownArgumentType = false
reportArgumentType = false

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[[tool.mypy.overrides]]
strict = true
module = ["ptsandbox.*", "docker.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
exclude = ["\\.venv/", "\\.mypy_cache/", "build/", "dist/"]

[tool.ruff]
lint.select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
lint.ignore = [
  "E501",   # line too long, handled by black
  "B008",   # do not perform function calls in argument defaults
  "W191",   # indentation contains tabs
  "SIM117", # nested with (readability)
]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"sandbox_cli/cli/*.py" = ["UP007"]
